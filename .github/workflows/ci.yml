name: ci

# Mirrors the static, no-machine-state checks from verify/STATUS.md (Phases A,
# B, D) so every push gets the same gates that caught real bugs locally.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            shellcheck fish stow i3-wm python3

      # Discover scripts by shebang so a new stow package is covered automatically
      # (the old hardcoded globs silently skipped anything outside stow/bin).
      - name: A1 — bash -n (all shell scripts)
        run: |
          mapfile -t SH < <(grep -rlIE '^#!.*(bash|/bin/sh|env +sh)' \
            install.sh uninstall.sh lib stow tests | sort -u)
          printf 'bash -n over %d shell scripts\n' "${#SH[@]}"
          for f in "${SH[@]}"; do bash -n "$f"; done

      - name: A2 — shellcheck (full severity; .shellcheckrc is the policy)
        run: |
          mapfile -t SH < <(grep -rlIE '^#!.*(bash|/bin/sh|env +sh)' \
            install.sh uninstall.sh lib stow tests | sort -u)
          # No -S flag: info-level findings (unquoted expansions, SC2086) fail
          # the build; deliberate exceptions live in .shellcheckrc, so local
          # `shellcheck <file>` and CI agree exactly.
          shellcheck "${SH[@]}"

      - name: A7 — python syntax (LAN server + any future python)
        run: |
          mapfile -t PY < <(grep -rlIE '^#!.*python' \
            install.sh uninstall.sh lib stow tests | sort -u)
          printf 'py_compile over %d python scripts\n' "${#PY[@]}"
          # Write bytecode to a throwaway dir so __pycache__ never lands in the tree.
          export PYTHONPYCACHEPREFIX="$(mktemp -d)"
          for f in "${PY[@]}"; do python3 -m py_compile "$f"; done

      - name: A6 — TOML parses
        run: |
          python3 - <<'PY'
          import tomllib
          for f in ["stow/starship/.config/starship.toml",
                    "stow/alacritty/.config/alacritty/alacritty.toml"]:
              tomllib.load(open(f, "rb")); print("ok", f)
          PY

      - name: B — library logic (detect, mapping totality, manifests)
        run: |
          export CONFEPO_DIR="$PWD"; . lib/common.sh; detect_os
          test "$PKG" = apt
          for m in packages/common.txt packages/desktop.txt; do
            while IFS= read -r l; do l="${l%%#*}"; l="$(echo "$l" | xargs)"; [ -z "$l" ] && continue
              [ -n "$(pkg_name "$l")" ] || { echo "empty map: $l"; exit 1; }
            done < "$m"
          done
          echo "package-name mapping is total"

      - name: D1 — fish -n (all fish files)
        run: |
          for f in stow/fish/.config/fish/config.fish \
                   stow/fish/.config/fish/conf.d/*.fish \
                   stow/fish/.config/fish/functions/*.fish; do
            fish -n "$f"
          done

      - name: D2 — i3 config validates
        run: i3 -C -c stow/i3/.config/i3/config

      - name: D3 — stow dry-run (no conflicts)
        run: |
          mkdir -p ~/.config ~/.local/bin ~/.config/fish/{conf.d,functions} ~/.config/git
          for d in stow/*/; do
            stow -nv --target="$HOME" --dir="$PWD/stow" "$(basename "$d")"
          done

  # Behavioural regression suite — every case was once a real bug (2026-08
  # audit) or a hand-verified guard. See tests/run.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tmux jq python3
      - name: Regression suite
        run: ./tests/run

  # The static job proves the scripts parse; this one proves the README's
  # actual promises — install works, re-running is safe, uninstall reverts
  # and exits 0 — by executing them on a throwaway runner.
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: E1 — fresh install (CLI profile, no chsh)
        run: ./install.sh --no-desktop --no-chsh

      - name: E2 — re-run is idempotent (the README's "safe to re-run")
        run: ./install.sh --no-desktop --no-chsh

      - name: E3 — links exist and resolve into the repo
        run: |
          test -L ~/.config/fish/config.fish
          readlink -f ~/.config/fish/config.fish | grep -qF "$PWD/stow/"
          test -x ~/.local/bin/confepo

      - name: E4 — uninstall reverts everything and exits 0
        run: |
          ./uninstall.sh          # exit code IS the assertion (set -e)
          # no symlink anywhere under ~/.config or ~/.local may still point here
          if find ~/.config ~/.local -type l -lname "$PWD/*" 2>/dev/null | grep -q .; then
            echo "confepo symlinks survived uninstall:"; \
            find ~/.config ~/.local -type l -lname "$PWD/*"; exit 1
          fi

      - name: E5 — bogus --from fails BEFORE unlinking (regression guard)
        run: |
          ./install.sh --link-only
          if ./uninstall.sh --from 19990101-000000; then
            echo "typo'd stamp was accepted"; exit 1
          fi
          # the failed uninstall must not have removed anything
          test -L ~/.config/fish/config.fish
