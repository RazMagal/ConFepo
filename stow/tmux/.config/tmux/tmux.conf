# ~/.config/tmux/tmux.conf — managed by confepo

# ---- General ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc"   # truecolor
set -g history-limit 50000
set -g mouse on
set -sg escape-time 10            # snappier ESC (kinder to vim)
set -g focus-events on
set -g base-index 1               # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on        # keep window numbers gapless
set -g set-clipboard on
setw -g mode-keys vi

# ---- Prefix: Ctrl-a (easier reach than Ctrl-b; hit it twice to send a literal)
#      Prefer the default? Delete these three lines.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- Reload config ----
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded ✔"

# ---- Splits keep the current directory; intuitive | and - ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- Vim-style pane nav + resize (repeatable with -r) ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Vi copy mode (v to select, y to yank) ----
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---- Catppuccin Mocha status bar (matches the rest of confepo) ----
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#cdd6f4] "
set -g status-left-length 30
set -g status-right "#[fg=#89b4fa]#H #[fg=#6c7086]%a %d/%m %H:%M "
set -g status-right-length 60
setw -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W "
setw -g window-status-format "#[fg=#6c7086] #I:#W "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#89b4fa,fg=#1e1e2e"
