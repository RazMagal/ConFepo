# ~/.config/alacritty/alacritty.toml — managed by confepo
# Theme: Catppuccin Mocha

[env]
TERM = "alacritty"

[window]
opacity = 0.96
dynamic_title = true
dynamic_padding = true
padding = { x = 8, y = 8 }

[scrolling]
history = 10000

[font]
size = 11.0
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold   = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Italic" }

[cursor]
style = { shape = "Block", blinking = "On" }

# Mouse-select fills the X PRIMARY selection only (middle-click paste); the
# CLIPBOARD selection is written solely by an explicit Ctrl+Shift+C. false is
# already Alacritty's default; we pin it so a drag never ALSO grabs CLIPBOARD.
#
# This does NOT fully eliminate the intermittent warning:
#   "Unable to store text in clipboard: Failed to set new owner of XCB selection"
# Empirically reproduced (SetSelectionOwner -> flush -> GetSelectionOwner verify,
# the exact copypasta store path): the verify fails ONLY when another X client
# issues its own SetSelectionOwner in the sub-millisecond gap between Alacritty's
# set and its confirm-get. Findings:
#   - a merely-RESIDENT clipboard owner is harmless (0 failures) — it is NOT the
#     trigger;
#   - a client that SPAWNS a fresh grabber (each `xclip -selection ...` invocation
#     = a new SetSelectionOwner) concurrently with an Alacritty copy makes the
#     verify fail ~98% of the time;
#   - a passive read-only clipboard manager does NOT remove the race (still fails
#     with the concurrent grabber present), and a "persisting" manager that
#     re-owns CLIPBOARD only ADDS concurrent SetSelectionOwner calls.
# So there is no config or clipboard-manager fix here. save_to_clipboard=false
# still helps by cutting the number of CLIPBOARD stores (fewer collision windows);
# PRIMARY drags remain exposed and Alacritty has no knob to disable them. The
# warning is benign. The only genuine cures are writer-side (stop re-spawning
# racing xclip owners) or an Alacritty/copypasta upgrade that drops the verify.
[selection]
save_to_clipboard = false

# ---- Catppuccin Mocha palette ----
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.selection]
text = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

[keyboard]
bindings = [
  { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus",  mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0",   mods = "Control", action = "ResetFontSize"    },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy"  },
]

# ---------------------------------------------------------------------------
# Clipboard-warning suppression is TARGETED, and lives OUTSIDE this file.
#
# The `confepo-term` launcher (wired into i3 as $term, and rofi's terminal:)
# drops ONLY the single benign line
#   "Unable to store text in clipboard: Failed to set new owner of XCB selection"
# from Alacritty's stderr — every other Warn/Error diagnostic passes through.
# We deliberately do NOT set [debug].log_level: a global level is a blunt
# instrument that would also hush real warnings (config typos, font fallbacks).
# Root cause is the [selection] note above; the retire-it TODO is in confepo-term.
# ---------------------------------------------------------------------------
